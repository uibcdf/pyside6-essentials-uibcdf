package:
  name: pyside6-essentials-uibcdf
  version: "6.9.2"

source:
  path: ../../..

build:
  number: 0

requirements:
  host:
    - python =3.13
    - shiboken6-uibcdf ==6.9.2
  run:
    - python =3.13
    - shiboken6-uibcdf ==6.9.2

test:
  commands:
    - test -f "$SP_DIR/PySide6/QtCore.abi3.so"
    - test -f "$SP_DIR/PySide6/libpyside6.abi3.so.6.9"
    - test -f "$SP_DIR/PySide6/Qt/lib/libQt6Core.so.6"
    - python -c "import PySide6.QtCore; print(PySide6.QtCore.__file__)"

about:
  summary: "Experimental UIBCDF-aligned PySide6 Essentials package for Linux/Python 3.13."
  license: "LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only"
  description: |
    First experimental conda package boundary for the PySide6 Essentials slice
    in the provisional UIBCDF Qt-for-Python family.

extra:
  recipe-maintainers:
    - uibcdf
